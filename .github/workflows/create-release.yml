name: Create Release

run-name: Create Release


on:
  pull_request:
    branches:
      - 'release/**'
    types:
      - closed
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  id-token: write

jobs:
  release:
    name: ArchBoot
    uses: ArchBoot/reusables-worklows/.github/workflows/reusable-release.yml@feature/JAGT-workflows
    with:
      git_user_name: ${{ vars.GIT_USER }}
      git_user_email: ${{ vars.GIT_EMAIL }}
    secrets: inherit